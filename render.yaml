databases:
  - name: myapp-db
    plan: free
    region: singapore

services:
  - type: web
    name: myapp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myapp-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false